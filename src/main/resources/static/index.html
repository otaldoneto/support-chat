<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Support Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body>
<input id="conversationId" placeholder="Conversation ID" />
<input id="sender" placeholder="Your name" />
<input id="content" placeholder="Message" />
<button onclick="sendMessage()">Send</button>
<ul id="messages"></ul>

<script>
    let subscription = null;
    const stompClient = new StompJs.Client({
        webSocketFactory: () => new SockJS('/ws'),
        onConnect: () => {
            document.getElementById('conversationId').addEventListener('change', subscribeToConversation);
        },
    });
    stompClient.activate();

    function subscribeToConversation() {
        if (subscription) {
            subscription.unsubscribe();
        }
        const conversationId = document.getElementById('conversationId').value;
        document.getElementById('messages').innerHTML = '';
        subscription = stompClient.subscribe(`/topic/conversations/${conversationId}`, (frame) => {
            const message = JSON.parse(frame.body);
            const item = document.createElement('li');
            item.textContent = `${message.sender}: ${message.content}`;
            document.getElementById('messages').appendChild(item);
        });
    }

    function sendMessage() {
        const conversationId = document.getElementById('conversationId').value;
        const sender = document.getElementById('sender').value;
        const content = document.getElementById('content').value;
        stompClient.publish({
            destination: `/app/conversations/${conversationId}/chat.send`,
            body: JSON.stringify({ sender, content }),
        });
        document.getElementById('content').value = '';
    }
</script>
</body>
</html>
