spring.application.name=support-chat

# PostgreSQL: guarda conversas e mensagens
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/supportchat}
spring.datasource.username=${DB_USERNAME:supportchat}
spring.datasource.password=${DB_PASSWORD:supportchat}
# O schema é criado pelas migrations do Flyway; o Hibernate só confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
